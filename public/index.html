<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCAS Group Assignment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      text-align: center;
      margin-bottom: 30px;
    }

    form {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 18px;
      transition: border-color 0.3s;
    }

    input[type="text"] {
      letter-spacing: 1px;
      font-family: monospace;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .help-text {
      color: #888;
      font-size: 14px;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
    }

    .message.success {
      background: #efe;
      border: 1px solid #cfc;
      color: #363;
    }

    .message.info {
      background: #eef;
      border: 1px solid #ccf;
      color: #336;
    }

    .message h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .message p {
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .pdf-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.3s;
    }

    .pdf-link:hover {
      background: #5568d3;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 UCAS Group Assignment</h1>
    <p class="subtitle">Enter your UCAS Personal ID and email address to find out your group assignment and receive your course pack.</p>

    <form id="randomiseForm">
      <label for="ucas_code">UCAS Personal ID</label>
      <input 
        type="text" 
        id="ucas_code" 
        name="ucas_code" 
        pattern="[0-9]{10}" 
        maxlength="10"
        placeholder="1234567890"
        required
        autocomplete="off"
      />
      <div class="help-text">Enter exactly 10 digits.</div>

      <label for="email" style="margin-top: 20px;">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="your.email@example.com"
        required
        autocomplete="email"
        maxlength="254"
      />
      <div class="help-text">We'll send your confirmation and course pack here.</div>

      <button type="submit" id="submitBtn">Get My Group Assignment</button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer">
      Need help? Contact your course administrator
    </div>
  </div>

  <script>
    const form = document.getElementById('randomiseForm');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const ucasInput = document.getElementById('ucas_code');

    // Only allow digits in input
    ucasInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const ucasCode = ucasInput.value.trim();
      const email = document.getElementById('email').value.trim();
      
      // Validate format
      if (!/^[0-9]{10}$/.test(ucasCode) || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('error', '⚠️ Invalid Input', 'Please enter a valid 10-digit UCAS ID and a valid email address.');
        return;
      }

      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      messageBox.classList.remove('show');

      try {
        const response = await fetch('/randomise', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `ucas_code=${encodeURIComponent(ucasCode)}&email=${encodeURIComponent(email)}`
        });

        const data = await response.json();

        if (response.ok) {
          if (data.already_assigned) {
            showMessage('info', `ℹ️ You've already been assigned to the ${data.group_label}.`, 
              `If you can't find your pack, please check your junk or spam folder.<br>If you still can't find it, contact your course administrator.`,
              data.pdf_url
            );
          } else {
            showMessage('success', '✅ Assignment Complete!', 
              `You've been assigned to the <strong>${data.group_label}</strong>.<br>A confirmation email with your course pack has been sent to <strong>${email}</strong>.<br><em>Please check your junk or spam folder if you don't see it in your inbox.</em>`,
              data.pdf_url
            );
          }
        } else {
          showMessage('error', 'Error', data.error || 'Something went wrong. Please try again.');
        }
      } catch (error) {
        showMessage('error', 'Connection Error', 'Unable to connect to the server. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get My Assignment';
      }
    });

    function showMessage(type, title, html, pdfUrl = null) {
      messageBox.className = `message ${type} show`;
      
      let content = `<h3>${title}</h3><p>${html}</p>`;
      
      if (pdfUrl) {
        const groupLabel = title.includes('Video') || html.includes('Video') ? 'Video Course Pack' : 'AI Group Pack';
        content += `<a href="${pdfUrl}" class="pdf-link" target="_blank" rel="noopener">📄 Download ${groupLabel}</a>`;
      }
      
      messageBox.innerHTML = content;
    }
  </script>
</body>
</html>
